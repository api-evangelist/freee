description: >-
  FinOps view of freee spend. freee is subscription SaaS billed in Japanese yen
  (JPY), tax-excluded. freee Accounting corporate plans are billed per company
  per month with usage-based charges (従量課金) layered on; freee HR & Payroll plans
  include a base headcount and then bill per additional employee (per-user) per
  month. Annual billing is discounted versus monthly. The public REST API is
  included with a paid subscription - there is no separate metered API charge -
  so API-driven integrations do not add a distinct line item; they consume the
  same subscription entitlement. Cost is therefore driven by product mix
  (accounting vs HR/payroll), plan tier, company count, and employee headcount.
notes: >-
  Per-unit rates and usage-based (従量課金) charges are not reconciled here; confirm
  current list prices, employee add-on rates, and any overage on the freee
  pricing pages. Amounts are tax-excluded JPY.
