meters:
- name: accounting_subscription
  description: freee Accounting base subscription, billed per company per month (tax-excluded JPY).
  unit: company-months
  aggregation: sum
  dimensions:
  - company
  - plan
- name: accounting_usage_charges
  description: Usage-based charges (従量課金) layered on some accounting plans; not reconciled here.
  unit: charges
  aggregation: sum
  dimensions:
  - company
  - plan
- name: hr_subscription
  description: freee HR & Payroll base subscription, billed per company per month with a base headcount.
  unit: company-months
  aggregation: sum
  dimensions:
  - company
  - plan
- name: hr_additional_employees
  description: Additional employees beyond the base headcount, billed per employee per month.
  unit: employee-months
  aggregation: sum
  dimensions:
  - company
  - plan
principles:
- name: Visibility
  description: Track each freee product subscription, plan tier, company count, and billed employee headcount; API usage is included and does not meter separately.
- name: Allocation
  description: Map each freee company (事業所) and product subscription to the internal entity or cost center it serves.
- name: Optimization
  description: Right-size plan tiers to the features actually used, prefer annual billing over monthly, and review billed employee headcount to avoid paying for inactive employees.
- name: Accountability
  description: Assign an owner per freee subscription; review monthly JPY spend and any usage-based charges against budget.
