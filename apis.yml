aid: freee
url: https://raw.githubusercontent.com/api-evangelist/freee/refs/heads/main/apis.yml
name: freee
kind: company
description: freee K.K. (freee株式会社) is a Japanese cloud business-management SaaS
  company. Its core products are freee Accounting (会計freee) - cloud accounting and
  bookkeeping - and freee HR & Payroll (人事労務freee) - HR, attendance, and payroll -
  plus invoicing (freee請求書) and sales management. freee exposes well-documented
  public REST APIs for both accounting and HR, authenticated with OAuth 2.0
  (authorization code). Accounting endpoints live under
  https://api.freee.co.jp/api/1 and HR / payroll endpoints under
  https://api.freee.co.jp/hr/api/v1, and freee publishes machine-readable OpenAPI
  schemas for its platform.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
