    name: hr_starter_base
    type: flat
    metric: company
    limit: -1
    timeFrame: month
    geo: japan
    unit: 1
    price: '3000'
    currency: JPY
    userMultiplied: false
    notes: Tax-excluded JPY per month on annual billing, covering up to 5 employees (about 3,900/month on monthly billing).
  - label: Additional Employee (from 6th)
    name: hr_starter_per_employee
    type: usage
    metric: employee
    limit: -1
    timeFrame: month
    geo: japan
    unit: 1
    price: '600'
    currency: JPY
    userMultiplied: true
    notes: Tax-excluded JPY per additional employee per month beyond the included 5.
  elements:
